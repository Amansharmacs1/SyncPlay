<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#FFFFFF">
  <title>Offline — SyncPlay</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #F5F5F7;
      color: #1D1D1F;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      background: #FFFFFF;
      border: 1px solid rgba(210, 210, 215, 0.6);
      border-radius: 24px;
      padding: 40px 32px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.04);
    }
    .icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: #E8F2FE;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #0071E3;
    }
    h1 {
      font-size: 24px;
      font-weight: 600;
      color: #1D1D1F;
      margin-bottom: 8px;
      letter-spacing: -0.02em;
    }
    p {
      color: #86868B;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 28px;
    }
    .btn {
      display: inline-block;
      width: 100%;
      background: #0071E3;
      color: #FFFFFF;
      border: none;
      padding: 12px 24px;
      border-radius: 9999px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.15s ease;
    }
    .btn:hover {
      background: #0077ED;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .brand {
      margin-top: 32px;
      font-size: 12px;
      color: #86868B;
    }
    .brand span {
      color: #0071E3;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>
    <h1>You're Offline</h1>
    <p>SyncPlay requires an active internet connection to synchronize videos, chat, and connect live video calls.</p>
    <button class="btn" onclick="window.location.reload()">Check Connection & Retry</button>
  </div>
  <div class="brand">
    Sync<span>Play</span> — Watch together. Talk together. Anywhere.
  </div>
</body>
</html>
